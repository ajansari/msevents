# Moves Copilot's event PRs from "built" to "ready to merge":
#   1. When Copilot finishes building, ask Copilot to review the PR as the Event Reviewer.
#   2. When the reviewer replies "VERDICT: PASS", take the PR out of draft and label it "review: passed".
#      On "VERDICT: CHANGES_REQUESTED" it stays a draft and is labelled "review: changes requested".
# Nothing is merged automatically: merging stays a human decision.
#
# Runs when a "Copilot cloud agent" session finishes, every 10 minutes (runs triggered by Copilot's
# sessions can be held for approval, so the timer is what makes this reliable), or by hand for one PR.
# It only looks at open Copilot PRs (branches named copilot/...) that close an issue labelled
# "approved for build".
#
# Uses COPILOT_ASSIGN_TOKEN so the @copilot comment comes from the repository owner;
# Copilot only acts on @copilot mentions from people with write access.

name: Request event review

on:
  workflow_run:
    workflows: ["Copilot cloud agent"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check (leave empty to check all open Copilot PRs)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: review-event
  cancel-in-progress: false

jobs:
  request-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DECISION_MAKER: ${{ github.repository_owner }}
      ONLY_PR: ${{ inputs.pr }}
    steps:
      - name: Check the token is configured
        env:
          HAS_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN != '' }}
        run: |
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::Add the COPILOT_ASSIGN_TOKEN repository secret."; exit 1; }

      - name: Request reviews and act on verdicts
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          marker='<!-- event-reviewer-requested -->'
          PASSED='review: passed'; CHANGES='review: changes requested'

          if [ -n "$ONLY_PR" ]; then
            prs="$ONLY_PR"
          else
            prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
                    --json number,headRefName --jq '.[] | select(.headRefName | startswith("copilot/")) | .number')
          fi
          [ -n "$prs" ] || { echo "No open Copilot pull requests."; exit 0; }

          gh label create "$PASSED"  --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Event Reviewer passed this PR" 2>/dev/null || true
          gh label create "$CHANGES" --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Event Reviewer asked for changes" 2>/dev/null || true

          for pr in $prs; do
            echo "::group::PR #$pr"

            # Only PRs that close an issue approved for build.
            issues=$(gh api graphql -F owner="$owner" -F repo="$repo" -F n="$pr" -f query='
              query($owner: String!, $repo: String!, $n: Int!) {
                repository(owner: $owner, name: $repo) { pullRequest(number: $n) {
                  closingIssuesReferences(first: 10) { nodes { number labels(first: 30) { nodes { name } } } }
                } }
              }' --jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[]
                        | select(any(.labels.nodes[]; .name == "approved for build")) | "#\(.number)"] | join(", ")')
            if [ -z "$issues" ]; then echo "Doesn't close an issue approved for build; skipping."; echo "::endgroup::"; continue; fi

            # Only while Copilot isn't working on it (building or reviewing).
            last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/timeline" --paginate \
                     --jq '.[] | select(.event == "copilot_work_started" or .event == "copilot_work_finished") | .event' | tail -n1)
            if [ "$last" != "copilot_work_finished" ]; then
              echo "Copilot is still working (last event: ${last:-none}); checking again later."; echo "::endgroup::"; continue
            fi

            comments=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
                         --jq '.[] | {u: .user.login, t: .created_at, b: .body}' | jq -s '.')
            asked=$(jq -r --arg m "$marker" '[.[] | select(.b | contains($m)) | .t] | last // ""' <<<"$comments")

            # Step 1: build finished, review not yet requested.
            if [ -z "$asked" ]; then
              cat > comment.md <<EOF
          @copilot Please now review this pull request as the **Event Reviewer**, before it goes live.

          - Follow \`.github/agents/event-reviewer.agent.md\` and \`.github/copilot-instructions.md\` exactly.
          - **Use Copilot Fusion at High effort for this review.** This is @$DECISION_MAKER's preference.
          - Review independently: re-check every fact against the official sources rather than trusting the earlier build summary.
          - The issue(s) this PR closes: $issues. @$DECISION_MAKER's most recent comment there is the final word.
          - Finish with a reply that ends with \`VERDICT: PASS\` or \`VERDICT: CHANGES_REQUESTED\`.

          $marker
          EOF
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file comment.md
              echo "Asked Copilot to review PR #$pr."; echo "::endgroup::"; continue
            fi

            # Step 2: review requested; act on Copilot's latest verdict after the request.
            # The verdict must be on a line of its own, so a quoted copy of the request doesn't count.
            verdict=$(jq -r --arg after "$asked" '[.[] | select(.u == "Copilot" and .t > $after) | .b | split("\n")[] | sub("\\s+$"; "")
                        | select(test("^VERDICT: (PASS|CHANGES_REQUESTED)$")) | ltrimstr("VERDICT: ")] | last // ""' <<<"$comments")
            state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json isDraft,labels \
                      --jq '"\(.isDraft) \([.labels[].name] | join(","))"')
            draft="${state%% *}"; labels="${state#* }"

            case "$verdict" in
              PASS)
                gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label "$PASSED" > /dev/null
                case ",$labels," in *",$CHANGES,"*) gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label "$CHANGES" > /dev/null ;; esac
                if [ "$draft" = "true" ]; then
                  gh pr ready "$pr" --repo "$GITHUB_REPOSITORY"
                  echo "Review passed: PR #$pr is ready to merge."
                else
                  echo "Review passed; PR #$pr is already out of draft."
                fi ;;
              CHANGES_REQUESTED)
                case ",$labels," in
                  *",$CHANGES,"*) echo "Changes already flagged on PR #$pr." ;;
                  *) gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label "$CHANGES" > /dev/null
                     case ",$labels," in *",$PASSED,"*) gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label "$PASSED" > /dev/null ;; esac
                     echo "Review asked for changes on PR #$pr; it stays a draft." ;;
                esac ;;
              *) echo "Review requested; no verdict yet." ;;
            esac
            echo "::endgroup::"
          done
