# Publishes the site to GitHub Pages whenever the site changes on main
# (for example when you merge an Event Builder pull request), or on demand.

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Validate the event data
        run: node .github/scripts/validate-events.mjs

      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
